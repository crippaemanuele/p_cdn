<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2b7a78"
    >

    <title>Il Mio Piano Alimentare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="app-header">

        <div class="brand-row">

            <div class="brand">

                <div class="brand-logo">
                    🌿
                </div>

                <div>
                    <h1>Il mio piano alimentare</h1>

                    <div class="today-info">
                        <span id="current-date"></span>
                        <span class="separator">•</span>
                        <span id="current-time"></span>
                    </div>
                </div>

            </div>


            <button
                id="calendar-toggle"
                class="icon-btn"
                aria-label="Apri calendario"
                title="Calendario"
            >
                📅
            </button>

        </div>


        <!-- CALENDARIO A SCOMPARSA -->

        <div
            id="calendar-panel"
            class="calendar-panel"
        >

            <div class="calendar-title">
                📅 Vai a una data
            </div>

            <input
                type="date"
                id="date-picker"
            >

            <button
                id="today-btn"
                class="secondary-btn"
            >
                📍 Torna a oggi
            </button>

        </div>


        <!-- PASTO PIÙ PROSSIMO -->

        <div
            id="next-meal-banner"
            class="next-meal-banner"
        ></div>


        <!-- NAVIGAZIONE GIORNI -->

        <div
            id="days-container"
            class="days-scroll"
        ></div>

    </header>


    <!-- =========================
         CONTENUTO
    ========================== -->

    <main>

        <div
            id="meal-view"
            class="meal-view"
        ></div>

    </main>


    <!-- =========================
         PULSANTE FLOTTANTE
    ========================== -->

    <button
        id="next-meal-btn"
        class="floating-btn"
        title="Vai al prossimo pasto"
        aria-label="Vai al prossimo pasto"
    >
        ⏱️
    </button>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script src="script.js"></script>

</body>

</html>
